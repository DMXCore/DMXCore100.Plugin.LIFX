name: Build

on:
  push:
    # Main publishes via release.yml (build + release). Keep this workflow
    # off main so PRs and feature branches do not report skipped release /
    # sdk-float jobs.
    branches-ignore:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test tests/DMXCore100.LIFX.Tests --configuration Release

      - name: Build and pack
        run: ./pack.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lifx-plugin
          path: artifacts/*.dmxplugin
