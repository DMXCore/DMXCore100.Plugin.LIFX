name: Build

on:
  push:
  pull_request:
  schedule:
    # Weekly job restores DMXCore.PluginSdk 1.* so new SDK releases
    # surface breakage even when this repo is idle. Standard builds use
    # the pinned versions in the project files.
    - cron: '45 6 * * 1'

permissions:
  contents: read

# Serialise main-branch rolling-release updates so concurrent pushes
# cannot publish overlapping plugin tags out of order.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'lifx-main-release' || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test tests/DMXCore100.LIFX.Tests --configuration Release

      - name: Build and pack
        run: ./pack.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lifx-plugin
          path: artifacts/*.dmxplugin

  sdk-float:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - name: Restore floating 1.* SDK
        run: |
          dotnet add src/DMXCore100.LIFX/DMXCore100.LIFX.csproj package DMXCore.PluginSdk --version 1.*
          dotnet add tests/DMXCore100.LIFX.Tests/DMXCore100.LIFX.Tests.csproj package DMXCore.PluginSdk.Testing --version 1.*
          dotnet add tools/DMXCore100.LIFX.DevHost/DMXCore100.LIFX.DevHost.csproj package DMXCore.PluginSdk.Testing --version 1.*

      - name: Test against latest 1.* SDK
        run: |
          dotnet build tools/DMXCore100.LIFX.DevHost --configuration Release
          dotnet test tests/DMXCore100.LIFX.Tests --configuration Release

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lifx-plugin
          path: artifacts

      # Workflow artifacts expire; keep a GitHub Release marked "latest" for
      # the product build's DownloadGitHubRelease "latest release" mode.
      # Use an immutable per-commit tag (not a moving `latest` tag) so
      # git pull --tags does not conflict.
      - name: Publish latest GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="plugin-${GITHUB_SHA}"
          notes="Automatically packaged from \`${GITHUB_SHA}\`."

          gh release create "$tag" artifacts/*.dmxplugin \
            --target "$GITHUB_SHA" \
            --title "LIFX" \
            --notes "$notes" \
            --latest

          # Drop the historical moving tag; GitHub "latest release" is this
          # plugin-* tag. Then remove superseded rolling tags.
          gh release delete latest --cleanup-tag --yes || true
          gh api -X DELETE "repos/${GH_REPO}/git/refs/tags/latest" >/dev/null 2>&1 || true

          while IFS= read -r old; do
            [ -n "$old" ] || continue
            gh release delete "$old" --cleanup-tag --yes || true
          done < <(gh release list --limit 50 --json tagName,isLatest --jq '.[] | select(.isLatest|not) | .tagName | select(startswith("plugin-") or startswith("latest-next-"))')
