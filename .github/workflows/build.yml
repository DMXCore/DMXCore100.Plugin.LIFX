name: Build

on:
  push:
  pull_request:
  schedule:
    # Weekly job restores DMXCore.PluginSdk 1.* so new SDK releases
    # surface breakage even when this repo is idle. Standard builds use
    # the pinned versions in the project files.
    - cron: '45 6 * * 1'

permissions:
  contents: read

# Serialise main-branch rolling-release updates so concurrent pushes
# cannot publish overlapping plugin tags out of order.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'lifx-main-release' || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test tests/DMXCore100.LIFX.Tests --configuration Release

      - name: Build and pack
        run: ./pack.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lifx-plugin
          path: artifacts/*.dmxplugin

  sdk-float:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - name: Restore floating 1.* SDK
        run: |
          dotnet add src/DMXCore100.LIFX/DMXCore100.LIFX.csproj package DMXCore.PluginSdk --version 1.*
          dotnet add tests/DMXCore100.LIFX.Tests/DMXCore100.LIFX.Tests.csproj package DMXCore.PluginSdk.Testing --version 1.*
          dotnet add tools/DMXCore100.LIFX.DevHost/DMXCore100.LIFX.DevHost.csproj package DMXCore.PluginSdk.Testing --version 1.*

      - name: Test against latest 1.* SDK
        run: |
          dotnet build tools/DMXCore100.LIFX.DevHost --configuration Release
          dotnet test tests/DMXCore100.LIFX.Tests --configuration Release

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lifx-plugin
          path: artifacts

      # Workflow artifacts expire; keep a GitHub Release marked "latest" for
      # the product build's DownloadGitHubRelease "latest release" mode.
      # Use an immutable per-commit tag (not a moving `latest` tag) so
      # git pull --tags does not conflict.
      - name: Publish latest GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="plugin-${GITHUB_SHA}"
          notes="Automatically packaged from \`${GITHUB_SHA}\`."
          plugin_retain=3

          is_missing() {
            grep -Eiq 'not found|HTTP[[:space:]]*404' <<<"$1"
          }

          delete_release_and_tag() {
            local name="$1"
            local output rc=0
            output="$(gh release delete "$name" --cleanup-tag --yes 2>&1)" || rc=$?
            if [ "$rc" -eq 0 ]; then
              printf '%s\n' "$output"
            elif ! is_missing "$output"; then
              printf '%s\n' "$output" >&2
              return "$rc"
            fi
            rc=0
            output="$(gh api -X DELETE "repos/${GH_REPO}/git/refs/tags/${name}" 2>&1)" || rc=$?
            if [ "$rc" -eq 0 ]; then
              printf '%s\n' "$output"
            elif ! is_missing "$output"; then
              printf '%s\n' "$output" >&2
              return "$rc"
            fi
          }

          create_release() {
            gh release create "$tag" artifacts/*.dmxplugin \
              --target "$GITHUB_SHA" \
              --title "LIFX" \
              --notes "$notes" \
              --latest
          }

          view_rc=0
          view_output="$(gh release view "$tag" --json targetCommitish,assets 2>&1)" || view_rc=$?
          if [ "$view_rc" -eq 0 ]; then
            target="$(jq -r '.targetCommitish' <<<"$view_output")"
            if [ "$target" = "$GITHUB_SHA" ]; then
              existing="$(jq -r '.assets[].name' <<<"$view_output")"
              for file in artifacts/*.dmxplugin; do
                name="$(basename "$file")"
                if ! grep -Fxq "$name" <<<"$existing"; then
                  gh release upload "$tag" "$file"
                fi
              done
            else
              delete_release_and_tag "$tag"
              create_release
            fi
          elif is_missing "$view_output"; then
            create_release
          else
            printf '%s\n' "$view_output" >&2
            exit "$view_rc"
          fi

          # Drop the historical moving tag; GitHub "latest release" is this
          # plugin-* tag. Then remove superseded rolling tags, keeping a few
          # recent plugin-* releases and always excluding the current tag.
          gh release delete latest --cleanup-tag --yes || true
          gh api -X DELETE "repos/${GH_REPO}/git/refs/tags/latest" >/dev/null 2>&1 || true

          old_tags="$(
            gh release list --limit 50 --json tagName,createdAt \
              | jq -r --arg tag "$tag" --argjson keep "$plugin_retain" '
                  [.[] | select(.tagName != $tag)]
                  | sort_by(.createdAt) | reverse
                  | (
                      ([.[] | select(.tagName | startswith("plugin-"))][$keep:] | .[].tagName),
                      ([.[] | select(.tagName | startswith("latest-next-"))] | .[].tagName)
                    )
                '
          )"
          while IFS= read -r old; do
            [ -n "$old" ] || continue
            gh release delete "$old" --cleanup-tag --yes || true
          done <<<"$old_tags"
