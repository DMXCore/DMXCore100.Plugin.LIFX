name: Build

on:
  push:
  pull_request:
  schedule:
    # Weekly build so the floating DMXCore.PluginSdk 1.* reference surfaces
    # breakage from new SDK releases even when this repo is idle.
    - cron: '35 6 * * 1'

permissions:
  contents: write
  id-token: write  # OIDC token for nuget.org Trusted Publishing

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test tests/DMXCore100.LIFX.Tests --configuration Release

      - name: Build and pack
        run: ./pack.sh

      - uses: actions/upload-artifact@v7
        with:
          name: lifx-plugin
          path: |
            artifacts/*.dmxplugin
            artifacts/*.nupkg

      # Plugin registry: nuget.org is where DMX Core 100 devices browse,
      # install and update plugins from, so pushing here IS the release.
      # --skip-duplicate makes re-pushing an already published version a
      # no-op, so bumping <Version> in the csproj is what publishes.
      # A package pushed to nuget.org can never be deleted, so refuse a
      # package that lacks the plugin payload (built with an SDK that
      # predates registry packaging, or a broken pack) BEFORE logging in.
      - name: Verify plugin package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          pkg=$(ls artifacts/*.nupkg | head -1)
          if ! unzip -l "$pkg" | grep -q 'content/plugin.dmxplugin'; then
            echo "::error::$pkg lacks content/plugin.dmxplugin - not a DmxCorePlugin package"
            exit 1
          fi

      # Keyless (Trusted Publishing): GitHub's OIDC token is exchanged for a
      # one-hour nuget.org API key against the trusted-publishing policy
      # registered on nuget.org for this repo + workflow file. NUGET_USER (repo
      # or org Actions variable) is the nuget.org profile name that owns the policy.
      - name: NuGet login (OIDC)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish to nuget.org
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          dotnet nuget push artifacts/*.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --skip-duplicate

      # Workflow artifacts expire; keep a permanent copy of the current build
      # as a single rolling release. Recreated (not appended) so the "latest"
      # tag always points at the built commit. This repo is private, so
      # downloading the asset needs an authenticated request (gh release
      # download / a token) — the main product build does exactly that when it
      # bundles the plugin.
      - name: Update rolling latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Update in place instead of delete+recreate: a product build that
          # downloads the "latest release" mid-update must never find no
          # release at all.
          if gh release view latest > /dev/null 2>&1; then
            gh release upload latest artifacts/*.dmxplugin --clobber
            gh release edit latest --draft=false --notes "Automatically packaged from \`${GITHUB_SHA}\`."
            git tag -f latest "${GITHUB_SHA}"
            git push -f origin latest
          else
            # A normal (non-prerelease) release: the DMX Core 100 product
            # build downloads it with DownloadGitHubRelease's "latest
            # release" mode, which skips prereleases.
            gh release create latest artifacts/*.dmxplugin \
              --title "Latest build" \
              --notes "Automatically packaged from \`${GITHUB_SHA}\`."
          fi

      # Permanent, versioned release history: created once per manifest
      # version (the first main build carrying a new version publishes it),
      # never modified afterwards. The rolling 'latest' above remains what
      # the DMX Core 100 product build bundles.
      - name: Publish versioned release (once per version)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version "$(find src -name manifest.json | head -1)")
          if ! gh release view "v${version}" > /dev/null 2>&1; then
            gh release create "v${version}" artifacts/*.dmxplugin --title "v${version}" --notes "Version ${version}, packaged from commit ${GITHUB_SHA}."
          fi
